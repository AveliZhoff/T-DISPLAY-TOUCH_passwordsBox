; PlatformIO project
; T-Display PasswordsBox — LilyGO T-Display-S3 Touch (ESP32-S3)
;   * ST7789 170x320 on an 8-bit PARALLEL bus (not SPI!)
;   * CST816S capacitive touch on I2C
;   * optional GROW R503-S fingerprint sensor on UART (see ENABLE_R503S)
;
; Docs: https://docs.platformio.org/page/projectconf.html

[env:lilygo-t-display-s3]
platform = espressif32
board = lilygo-t-display-s3
framework = arduino

build_flags =
    ; TFT_eSPI's smooth fonts need FS, and the library dependency finder does
    ; not pull it in on its own.
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/FS/src
    ; The panel is wired to an 8-bit parallel (i8080) bus. include/tft_setup.h
    ; is the TFT_eSPI "Setup206" configuration for this board, force-included
    ; so that nothing inside .pio/libdeps has to be edited by hand.
    -DUSER_SETUP_LOADED=1
    -include include/tft_setup.h

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lennarthennigs/Button2@^2.0.3
    adafruit/Adafruit Fingerprint Sensor Library@^2.1.4

; CST816_TouchLib 1.0.1 is vendored in lib/CST816_TouchLib: the PlatformIO
; registry only offers 2.x, whose API was renamed. This code uses the 1.0.1
; interface begin(Wire, observer, PIN_INTERRUPT, I2C_ADDRESS, PIN_RESET).

monitor_speed = 115200
upload_speed = 921600
